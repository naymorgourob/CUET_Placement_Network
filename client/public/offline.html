<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — CUET Placement Network</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf9f6;
        color: #191a23;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Inter,
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #3730a6;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 600;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #5b5d6b;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        border: none;
        background: #3730a6;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: #2e2789;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e0f14;
          color: #f2f2f5;
        }
        p {
          color: #a5a6b3;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">C</div>
      <h1>You're offline</h1>
      <p>CUET Placement Network needs an internet connection for this page. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
